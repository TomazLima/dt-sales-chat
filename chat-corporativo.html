<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corporativo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs" type="module" id="pdfjs-script"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --magenta:      #E20074;
      --magenta-dark: #B50060;
      /* Azul do botão RD. A cor separa as duas fontes de dado no header:
         RD Station em azul, Magenta Force no magenta da marca.
         Começou em #002D72 (marinho fechado) e subiu para cá: em texto de 13px
         num círculo de 36px, aquele tom lia como preto — a cor só cumpre o papel
         de distinguir se for reconhecível como azul à primeira vista. */
      --navy:         #0B47B3;
      --navy-dark:    #073387;
      --bg:           #F2F2F2;
      --surface:      #FFFFFF;
      --text:         #1A1A1A;
      --text-muted:   #6B6B6B;
      --border:       #E0E0E0;
      --bot-bg:       #FFFFFF;
      --user-bg:      #E20074;
      --user-text:    #FFFFFF;
      --radius:       16px;
      --danger:       #C0362C;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      background: var(--magenta);
      color: #fff;
      padding: 0 20px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    /* O bloco da marca é um link para a capa (home.html). Discreto de propósito:
       parece o cabeçalho de sempre e só revela o alvo no hover — não deve competir
       com Histórico / Nova conversa / Sair, que são a ação principal do usuário. */
    .header-brand {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; color: inherit;
      border-radius: 8px; padding: 4px 8px; margin-left: -8px;
      transition: background .15s ease;
    }
    .header-brand:hover, .header-brand:focus-visible {
      background: rgba(255, 255, 255, .15);
      outline: none;
    }
    .header-back {
      font-size: 15px; opacity: .75;
      margin-right: -2px;
    }
    .header-logo {
      width: 32px; height: 32px;
      background: #fff;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 13px; color: var(--magenta);
      letter-spacing: -0.5px;
    }
    .header-title { font-weight: 600; font-size: 15px; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    #header-user { font-size: 13px; opacity: .85; }
    #btn-new-chat {
      background: rgba(255,255,255,.2);
      border: 1px solid rgba(255,255,255,.4);
      color: #fff;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: background .2s;
    }
    #btn-new-chat:hover { background: rgba(255,255,255,.35); }

    /* ── TELAS ── */
    .screen { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
    .screen[hidden] { display: none; }

    /* ── TELA DE LOGIN ── */
    #login-screen {
      justify-content: center;
      align-items: center;
      padding: 24px;
    }
    .login-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 36px 32px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }
    .login-logo {
      width: 48px; height: 48px;
      background: var(--magenta);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 18px; color: #fff;
      margin-bottom: 20px;
    }
    .login-card h2 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
    .login-card p  { font-size: 14px; color: var(--text-muted); margin-bottom: 28px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .form-group label { font-size: 13px; font-weight: 500; color: var(--text); }
    .form-group input {
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color .2s;
    }
    .form-group input:focus { border-color: var(--magenta); }
    #btn-login {
      width: 100%;
      padding: 12px;
      background: var(--magenta);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      transition: background .2s;
    }
    #btn-login:hover    { background: var(--magenta-dark); }
    #btn-login:disabled { background: #BDBDBD; cursor: default; }
    #login-error {
      font-size: 13px; color: #D32F2F;
      background: #FFF3F3; border: 1px solid #FFCDD2;
      border-radius: 8px; padding: 10px 12px;
      margin-top: 14px; display: none;
    }
    #login-error.visible { display: block; }

    /* Logout button */
    #btn-logout {
      background: rgba(255,255,255,.2);
      border: 1px solid rgba(255,255,255,.4);
      color: #fff; padding: 5px 12px;
      border-radius: 20px; font-size: 12px;
      font-family: inherit; cursor: pointer;
      transition: background .2s;
    }
    #btn-logout:hover { background: rgba(255,255,255,.35); }

    /* ── TELA DE TROCA DE SENHA ── */
    #change-password-screen {
      justify-content: center;
      align-items: center;
      padding: 24px;
    }
    .change-password-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 36px 32px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }
    .change-password-card .login-logo { background: var(--magenta); }
    .change-password-card h2 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
    .change-password-card p  { font-size: 14px; color: var(--text-muted); margin-bottom: 28px; }
    #btn-change-password {
      width: 100%; padding: 12px;
      background: var(--magenta); color: #fff;
      border: none; border-radius: 10px;
      font-family: inherit; font-size: 15px; font-weight: 600;
      cursor: pointer; margin-top: 4px; transition: background .2s;
    }
    #btn-change-password:hover    { background: var(--magenta-dark); }
    #btn-change-password:disabled { background: #BDBDBD; cursor: default; }
    #change-password-error {
      font-size: 13px; color: #D32F2F;
      background: #FFF3F3; border: 1px solid #FFCDD2;
      border-radius: 8px; padding: 10px 12px;
      margin-top: 14px; display: none;
    }
    #change-password-error.visible { display: block; }

    /* ── TELA DE CHAT ── */
    #chat-screen { background: var(--bg); }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    /* Bolhas */
    .msg-row {
      display: flex;
      gap: 8px;
      max-width: 75%;
    }
    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.bot  { align-self: flex-start; }

    .msg-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700;
      flex-shrink: 0; align-self: flex-end;
    }
    .bot  .msg-avatar { background: var(--magenta); color: #fff; }
    .user .msg-avatar { background: #1A1A1A; color: #fff; }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.55;
    }
    .bot  .msg-bubble { background: var(--bot-bg); color: var(--text); border-bottom-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .bot .msg-bubble p { margin: 0 0 10px; }
    .bot .msg-bubble p:last-child { margin-bottom: 0; }
    .bot .msg-bubble ul { margin: 2px 0 12px; padding-left: 4px; list-style: none; }
    .bot .msg-bubble ul li { padding-left: 16px; position: relative; }
    .bot .msg-bubble ul li::before { content: '\2022'; color: var(--magenta); font-weight: 700; position: absolute; left: 0; }
    .bot .msg-bubble ol { margin: 2px 0 12px; padding-left: 22px; }
    .bot .msg-bubble ol li::marker { color: var(--magenta); font-weight: 700; }
    .bot .msg-bubble li { margin-bottom: 6px; }
    .bot .msg-bubble li:last-child { margin-bottom: 0; }
    .bot .msg-bubble hr { border: none; border-top: 1.5px solid var(--border); margin: 12px 0; }
    .bot .msg-bubble strong { font-weight: 700; color: inherit; }
    .bot .msg-bubble h1, .bot .msg-bubble h2, .bot .msg-bubble h3 { font-weight: 700; margin: 14px 0 6px; color: var(--text); }
    .bot .msg-bubble h1:first-child, .bot .msg-bubble h2:first-child, .bot .msg-bubble h3:first-child, .bot .msg-bubble .msg-section-title:first-child { margin-top: 0; }
    .bot .msg-bubble h1 { font-size: 17px; }
    .bot .msg-bubble h2 { font-size: 15px; }
    .bot .msg-bubble h3 { font-size: 14px; }
    .bot .msg-bubble .msg-section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--magenta);
      margin: 16px 0 8px;
      padding-bottom: 5px;
      border-bottom: 1.5px solid var(--border);
    }
    /* Tabelas largas (10+ colunas no PB) espremiam número contra a largura da
       bolha (75vw) e o overflow-wrap: anywhere quebrava valor no meio do
       dígito — feio e difícil de ler. Em vez de encolher a tabela, ela cresce
       no tamanho natural do conteúdo e a rolagem fica só no wrapper. */
    .bot .msg-bubble .msg-table-wrap { overflow-x: auto; margin: 10px 0; -webkit-overflow-scrolling: touch; }
    .bot .msg-bubble table { table-layout: auto; border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; margin: 0; font-size: 12px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .bot .msg-bubble th { background: var(--magenta); color: #fff; font-weight: 600; padding: 7px 8px; text-align: left; white-space: nowrap; }
    .bot .msg-bubble td { padding: 7px 8px; border-top: 1px solid var(--border); white-space: nowrap; }
    .bot .msg-bubble tr:first-child td { border-top: none; }
    .bot .msg-bubble tr:nth-child(even) td { background: #FAFAFA; }
    .bot .msg-bubble .cell-danger { color: var(--danger); font-weight: 700; }
    .user .msg-bubble { background: var(--user-bg); color: var(--user-text); border-bottom-right-radius: 4px; }

    .msg-meta { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    .user .msg-meta { text-align: right; }

    /* Fontes */
    .msg-sources {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
      display: flex; flex-wrap: wrap; gap: 4px;
    }
    .source-tag {
      background: #F0F0F0;
      border: 1px solid var(--border);
      padding: 2px 7px;
      border-radius: 10px;
      font-size: 11px;
    }

    /* Typing indicator */
    #typing-indicator {
      align-self: flex-start;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
    }
    #typing-indicator.visible { display: flex; }
    .typing-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--magenta);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }
    .typing-dots {
      background: var(--bot-bg);
      border-radius: var(--radius);
      border-bottom-left-radius: 4px;
      padding: 12px 16px;
      display: flex; gap: 5px; align-items: center;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .typing-dots span {
      width: 7px; height: 7px;
      background: #BDBDBD;
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing-dots span:nth-child(2) { animation-delay: .2s; }
    .typing-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-6px); }
    }

    /* Attachment chip */
    #attachment-bar {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 16px 0;
      background: var(--surface);
    }
    #attachment-bar.visible { display: flex; }
    .attach-chip {
      display: flex; align-items: center; gap: 6px;
      background: #F0F0F0;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 10px 4px 8px;
      font-size: 12px; color: var(--text);
    }
    .attach-chip span { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .attach-remove {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); font-size: 14px; line-height: 1;
      padding: 0 0 0 2px;
    }
    .attach-remove:hover { color: var(--magenta); }

    /* Input area */
    #input-area {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 12px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    /* Attach button */
    #btn-attach {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: none;
      border: 1.5px solid var(--border);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: var(--text-muted);
      transition: border-color .2s, color .2s;
    }
    #btn-attach:hover { border-color: var(--magenta); color: var(--magenta); }
    #btn-attach svg { width: 16px; height: 16px; }
    /* Obrigatória: o seletor de ID acima define display, que vence o [hidden]
       do UA stylesheet por especificidade — mesma armadilha dos botões do
       header, já documentada. Sem isto ATTACH_ENABLED=false não esconde nada. */
    #btn-attach[hidden] { display: none; }
    #file-input { display: none; }
    #msg-input {
      flex: 1;
      resize: none;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.5;
      outline: none;
      max-height: 120px;
      overflow-y: auto;
      transition: border-color .2s;
    }
    #msg-input:focus { border-color: var(--magenta); }
    #msg-input::placeholder { color: #BDBDBD; }
    #btn-send {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: var(--magenta);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background .2s, transform .1s;
    }
    #btn-send:hover   { background: var(--magenta-dark); }
    #btn-send:active  { transform: scale(.93); }
    #btn-send:disabled { background: #BDBDBD; cursor: default; transform: none; }
    #btn-send svg { width: 18px; height: 18px; fill: #fff; }

    /* ── BOTÃO CRM (RD Station) ── */
    /* Sigla no lugar do ícone: com quatro botões redondos lado a lado, um
       gráfico de barras e um alvo não dizem qual base cada um consulta. RD e MF
       são como as duas fontes são chamadas no dia a dia. O title continua
       trazendo o nome por extenso. */
    #btn-crm {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: none;
      border: 1.5px solid var(--border);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      color: var(--navy); border-color: var(--navy);
      font-size: 13px; font-weight: 700; letter-spacing: .3px;
      transition: border-color .2s, color .2s, background-color .2s;
    }
    /* O hover não troca mais a cor (ela agora identifica a fonte): escurece e
       preenche de leve, que é feedback suficiente. */
    #btn-crm:hover { color: var(--navy-dark); border-color: var(--navy-dark); background: rgba(11, 71, 179, .10); }
    #btn-crm[hidden] { display: none; }

    /* ── MENU CRM ── */
    #crm-menu-overlay {
      display: none;
      position: fixed; inset: 0;
      z-index: 300;
    }
    #crm-menu-overlay.open { display: block; }

    #crm-menu {
      position: fixed;
      bottom: 74px;
      left: 50%; transform: translateX(-50%);
      width: min(420px, calc(100vw - 32px));
      /* Sem isto o painel crescia para CIMA sem limite — com o PB (20+ itens em
         5 blocos) o topo passava do topo da tela e a primeira opção ficava
         inacessível sem dar zoom out (reportado pelo Anderson, 20/08). Trava a
         altura e deixa o CONTEÚDO rolar por dentro; o cabeçalho fica fixo. */
      max-height: min(70vh, calc(100vh - 140px));
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: 0 -4px 24px rgba(0,0,0,.16);
      z-index: 301;
      overflow: hidden;
      display: none;
      flex-direction: column;
    }
    #crm-menu.open { display: flex; }

    .crm-menu-header {
      display: flex; align-items: center; gap: 8px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0; /* fica fixo; quem rola é o conteúdo abaixo */
    }
    .crm-menu-back {
      background: none; border: none; cursor: pointer;
      color: var(--magenta); font-size: 20px; font-weight: 600;
      line-height: 1; padding: 0; display: none;
    }
    .crm-menu-back.visible { display: block; }
    .crm-menu-title { font-size: 14px; font-weight: 600; flex: 1; }
    .crm-menu-close {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); font-size: 18px; line-height: 1; padding: 2px 4px;
    }
    .crm-menu-close:hover { color: var(--text); }

    /* .crm-menu-items (RD) e .crm-menu-body (MF/PB) são as duas classes de
       conteúdo usadas pelos diferentes renderXXXMenu — as duas precisam rolar,
       já que qualquer uma pode ter mais itens do que cabe no max-height acima.
       min-height:0 é necessário para o filho de um flex container conseguir
       encolher e rolar de verdade, em vez de estourar o pai. */
    .crm-menu-items, .crm-menu-body {
      padding: 6px 0;
      overflow-y: auto;
      min-height: 0;
    }

    .crm-menu-item {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 16px;
      cursor: pointer;
      transition: background .15s;
      font-size: 14px;
      border: none; background: none;
      width: 100%; text-align: left;
      color: var(--text); font-family: inherit;
    }
    .crm-menu-item:hover { background: #FFF5FA; }
    .crm-menu-icon  { font-size: 16px; width: 22px; text-align: center; flex-shrink: 0; }
    .crm-menu-label { flex: 1; }
    .crm-menu-arrow { color: var(--text-muted); font-size: 16px; }
    .crm-menu-divider { height: 1px; background: var(--border); margin: 4px 0; }

    /* Filtro de vendedor ativo, no topo do menu. Precisa saltar aos olhos: a
       seleção PERSISTE entre aberturas do menu, e ler a carteira de uma pessoa
       achando que é a do time é o erro que este aviso existe para evitar. */
    .menu-filtro {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin: 8px 10px 4px; padding: 8px 10px;
      border-radius: 8px;
      background: rgba(226, 0, 116, .08);
      border: 1px solid var(--magenta);
    }
    .menu-filtro-txt { font-size: 13px; font-weight: 600; color: var(--magenta); }
    .menu-filtro-x {
      background: none; border: none; cursor: pointer;
      font-size: 11px; font-weight: 600; color: var(--magenta);
      text-decoration: underline; padding: 2px 4px;
    }

    /* Cabeçalho de bloco dentro do menu (usado pelo PB, que tem 18 itens em
       quatro grupos — sem a separação vira uma lista longa e indistinta). */
    .crm-menu-section {
      padding: 10px 12px 4px;
      font-size: 11px; font-weight: 700; letter-spacing: .4px;
      text-transform: uppercase;
      color: var(--text-soft, #6B7280);
    }

    /* ── BOTÃO REUNIÕES / LISTA DE REUNIÕES ── */
    #btn-meetings {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: none;
      border: 1.5px solid var(--border);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: var(--text-muted);
      font-size: 16px;
      transition: border-color .2s, color .2s;
    }
    #btn-meetings:hover { border-color: var(--magenta); color: var(--magenta); }
    #btn-meetings[hidden] { display: none; }

    .meetings-list { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; max-width: 340px; }
    .meeting-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
      text-align: left;
      transition: border-color .15s, background .15s;
    }
    .meeting-item:hover { border-color: var(--magenta); background: #FFF5FA; }

    /* ── BOTÃO FERRAMENTAS DE IA ── */
    #btn-tools {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: none;
      border: 1.5px solid var(--border);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: var(--text-muted);
      font-size: 16px;
      transition: border-color .2s, color .2s;
    }
    #btn-tools:hover { border-color: var(--magenta); color: var(--magenta); }
    #btn-tools[hidden] { display: none; }

    /* ── BOTÃO MAGENTA FORCE ── */
    #btn-magf {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: none;
      border: 1.5px solid var(--border);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      color: var(--magenta); border-color: var(--magenta);
      font-size: 13px; font-weight: 700; letter-spacing: .3px;
      transition: border-color .2s, color .2s, background-color .2s;
    }
    #btn-magf:hover { color: var(--magenta-dark); border-color: var(--magenta-dark); background: rgba(226, 0, 116, .08); }
    /* Sem esta regra o display:flex do seletor de ID vence o [hidden] do UA
       stylesheet por especificidade e o botão aparece mesmo com MAGF_ENABLED=false. */
    #btn-magf[hidden] { display: none; }

    /* ── BOTÃO PB (perguntas estratégicas) ──
       Terceira fonte no header. Cor própria — cinza-grafite — porque as duas
       existentes identificam BASE (azul = RD Station, magenta = Magenta Force)
       e o PB cruza as duas: pintá-lo de uma delas sugeriria que consulta só
       aquela. */
    #btn-pb {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: none;
      border: 1.5px solid var(--border);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      color: #3D4A5C; border-color: #3D4A5C;
      font-size: 13px; font-weight: 700; letter-spacing: .3px;
      transition: border-color .2s, color .2s, background-color .2s;
    }
    #btn-pb:hover { color: #253242; border-color: #253242; background: rgba(61, 74, 92, .08); }
    /* Obrigatória: sem ela o display:flex do seletor de ID vence o [hidden] do
       UA stylesheet por especificidade e o botão aparece com PB_ENABLED=false. */
    #btn-pb[hidden] { display: none; }

    .tools-list { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; max-width: 340px; }
    .tool-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
      text-align: left;
      transition: border-color .15s, background .15s;
    }
    .tool-item:hover { border-color: var(--magenta); background: #FFF5FA; }

    /* ── PAINEL DE HISTÓRICO ── */
    #btn-history {
      background: rgba(255,255,255,.2);
      border: 1px solid rgba(255,255,255,.4);
      color: #fff; padding: 5px 12px;
      border-radius: 20px; font-size: 12px;
      font-family: inherit; cursor: pointer;
      transition: background .2s;
    }
    #btn-history:hover { background: rgba(255,255,255,.35); }

    #history-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.35);
      z-index: 200;
    }
    #history-overlay.open { display: block; }

    #history-panel {
      position: fixed; top: 0; right: -360px;
      width: 340px; height: 100%;
      background: var(--surface);
      box-shadow: -4px 0 20px rgba(0,0,0,.12);
      display: flex; flex-direction: column;
      z-index: 201;
      transition: right .28s ease;
    }
    #history-panel.open { right: 0; }

    .history-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .history-header h3 { font-size: 15px; font-weight: 600; }
    #btn-close-history {
      background: none; border: none; cursor: pointer;
      font-size: 20px; color: var(--text-muted); line-height: 1;
    }
    #btn-close-history:hover { color: var(--text); }

    #history-list {
      flex: 1; overflow-y: auto;
      padding: 12px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .history-empty {
      text-align: center; color: var(--text-muted);
      font-size: 13px; padding: 40px 16px;
    }
    .history-session {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .history-session:hover { border-color: var(--magenta); background: #FFF5FA; }
    .history-session-date { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
    .history-session-preview { font-size: 13px; color: var(--text); line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .history-session-count { font-size: 11px; color: var(--magenta); margin-top: 4px; }
    #history-loading { text-align: center; color: var(--text-muted); font-size: 13px; padding: 40px 16px; }

    /* Toast de erro */
    #toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: #333; color: #fff;
      padding: 10px 20px; border-radius: 8px;
      font-size: 13px; opacity: 0;
      transition: opacity .3s;
      pointer-events: none; z-index: 100;
    }
    #toast.show { opacity: 1; }

    /* Mensagem de boas-vindas */
    .welcome-msg {
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      padding: 24px 16px;
      flex-shrink: 0;
    }
    .welcome-msg strong { color: var(--text); }
  </style>
</head>
<body>

<!-- ── HEADER ───────────────────────────────────────────────── -->
<header>
  <!-- Caminho RELATIVO de propósito: o site é servido pelo GitHub Pages em
       /dt-sales-chat/, um subdiretório. Um href="/index.html" absoluto apontaria
       para tomazlima.github.io/index.html, fora do projeto. -->
  <a class="header-brand" href="home.html" title="Ver todos os assistentes" aria-label="Voltar para a lista de assistentes">
    <span class="header-back" aria-hidden="true">←</span>
    <div class="header-logo">CO</div>
    <span class="header-title">Corporativo</span>
  </a>
  <div class="header-right">
    <span id="header-user"></span>
    <button id="btn-history" hidden>🕐 Histórico</button>

</header>

<!-- ── TELA: LOGIN ───────────────────────────────────────────── -->
<div id="login-screen" class="screen">
  <div class="login-card">
    <div class="login-logo">CO</div>
    <h2>Entrar</h2>
    <p>Acesse o Corporativo</p>
    <div class="form-group">
      <label for="input-email">Email</label>
      <input type="email" id="input-email" placeholder="seu@email.com" autocomplete="email">
    </div>
    <div class="form-group">

      <input type="password" id="input-password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button id="btn-login">Entrar</button>
    <div id="login-error"></div>
    <div id="user-list" style="display:none">
    </div>

</div>

<!-- ── TELA: TROCA DE SENHA ──────────────────────────────────── -->
<div id="change-password-screen" class="screen" hidden>
  <div class="change-password-card">
    <div class="login-logo">CO</div>
    <h2>Crie sua senha</h2>
    <p>Este é seu primeiro acesso. Defina uma senha pessoal para continuar.</p>
    <div class="form-group">
      <label for="cp-current">Senha temporária</label>
      <input type="password" id="cp-current" placeholder="••••••••">

    <div class="form-group">
      <label for="cp-new">Nova senha</label>

<!-- ── TELA: CHAT ────────────────────────────────────────────── -->
<div id="chat-screen" class="screen" hidden>
  <div id="messages">
    <div class="welcome-msg">

    </div>

    <!-- Typing indicator -->

  <div id="attachment-bar">
    <div class="attach-chip">
      <span>📄 </span><span id="attach-name"></span>

  <div id="input-area">
    <input type="file" id="file-input" accept=".pdf,.txt,.md">
    <button id="btn-attach" title="Anexar arquivo (PDF, TXT)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66L9.41 17.41a2 2 0 01-2.83-2.83l8.49-8.48"/>
      </svg>
    </button>
    <button id="btn-crm" title="RD Station — leads e tarefas" hidden>RD</button>
    <button id="btn-meetings" title="Reuniões" hidden>📅</button>
    <button id="btn-tools" title="Ferramentas de IA" hidden>🛠️</button>
    <button id="btn-magf" title="Magenta Force — pipeline de vendas" hidden>MF</button>
    <button id="btn-pb" title="Painel estratégico — RD Station + Magenta Force" hidden>PB</button>
    <textarea id="msg-input" rows="1" placeholder="Digite sua mensagem..."></textarea>
    <button id="btn-send" title="Enviar">

<!-- ── HISTÓRICO PANEL ────────────────────────────────────── -->
<div id="history-overlay"></div>
<div id="history-panel">
  <div class="history-header">
    <h3>Histórico de conversas</h3>
    <button id="btn-close-history">✕</button>
  </div>
  <div id="history-list"></div>
</div>

<!-- CRM Menu -->
<div id="crm-menu-overlay"></div>
<div id="crm-menu"></div>

<!-- Toast -->
<div id="toast"></div>

<script>
  // ── CONFIG ──────────────────────────────────────────────────────────────────
  const API_BASE  = 'https://dtgbsn8n.eastus.cloudapp.azure.com/webhook';
  const API_KEY   = 'corporativo-key-2024';
  const NAMESPACE = 'corporativo';
  const LOGO      = 'CO';
  const CRM_ENABLED      = false;
  const MEETINGS_ENABLED = true;
  const TOOLS_ENABLED    = true;
  const MAGF_ENABLED     = false;
  const PB_ENABLED       = false;
  // Anexo (clipe): lê o arquivo no browser e embute o texto na pergunta. Só faz
  // sentido onde o chat conversa sobre DOCUMENTOS. No dt-sales, que virou chat
  // só de funil, o anexo caía no RAG e recebia "não tenho acesso a documentos
  // de produto" — o recurso existia na tela sem ter como funcionar.
  const ATTACH_ENABLED   = true;

  let currentUser = null; // { id, name, email }

  // ── API ─────────────────────────────────────────────────────────────────────
  async function apiCall(endpoint, body) {
    const headers = { 'Content-Type': 'application/json' };
    if (typeof API_KEY !== 'undefined') headers['X-API-Key'] = API_KEY;
    const res = await fetch(`${API_BASE}/${endpoint}`, {
      method: 'POST',
      headers,
      body: JSON.stringify({ ...body, namespace: NAMESPACE })
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  // ── SESSÃO ──────────────────────────────────────────────────────────────────
  function getSessionId(userId) {
    const key = `dt_session_${userId}`;
    let sid = localStorage.getItem(key);
    if (!sid) {
      sid = `u${userId}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
      localStorage.setItem(key, sid);
    }
    return sid;
  }

  async function clearSession() {
    if (!currentUser) return;
    const sid = getSessionId(currentUser.id);
    try {
      await apiCall('users', { action: 'clear_session', session_id: sid });
    } catch(e) { /* silencia */ }
    localStorage.removeItem(`dt_session_${currentUser.id}`);
    // Limpa mensagens da tela
    const msgs = document.getElementById('messages');
    while (msgs.firstChild && msgs.firstChild !== typingIndicator) {
      msgs.removeChild(msgs.firstChild);
    }
    msgs.insertBefore(welcomeDiv, typingIndicator);
    showToast('Conversa reiniciada');
  }

  // ── LOGIN ────────────────────────────────────────────────────────────────────
  const loginError  = document.getElementById('login-error');
  const btnLogin    = document.getElementById('btn-login');
  const inputEmail  = document.getElementById('input-email');
  const inputPwd    = document.getElementById('input-password');

  function showLoginError(msg) {
    loginError.textContent = msg;
    loginError.classList.add('visible');
  }
  function hideLoginError() { loginError.classList.remove('visible'); }

  async function doLogin() {
    const email    = inputEmail.value.trim();
    const password = inputPwd.value;
    if (!email || !password) { showLoginError('Preencha email e senha.'); return; }

    btnLogin.disabled = true;
    btnLogin.textContent = 'Entrando...';
    hideLoginError();

    try {
      const data = await apiCall('users', { action: 'login', email, password });
      if (data.success && data.user) {
        inputPwd.value = '';
        if (!data.user.email) data.user.email = email; // garante que o email sempre fica no currentUser
        if (data.user.must_change_password) {
          showChangePassword(data.user);
        } else {
          localStorage.setItem('dt_current_user', JSON.stringify(data.user));
          startChat(data.user);
        }
      } else {
        showLoginError(data.error || 'Email ou senha incorretos.');
      }
    } catch(e) {
      showLoginError('Erro de conexão. Tente novamente.');
    } finally {
      btnLogin.disabled = false;
      btnLogin.textContent = 'Entrar';
    }
  }

  // ── TROCA DE SENHA ───────────────────────────────────────────────────────────
  let pendingUser = null; // usuário aguardando troca de senha

  function showChangePassword(user) {
    pendingUser = user;
    document.getElementById('login-screen').hidden = true;
    document.getElementById('change-password-screen').hidden = false;
    document.getElementById('cp-current').value = '';
    document.getElementById('cp-new').value = '';
    document.getElementById('cp-confirm').value = '';
    document.getElementById('cp-current').focus();
  }

  async function doChangePassword() {
    const current = document.getElementById('cp-current').value;
    const newPwd   = document.getElementById('cp-new').value;
    const confirm  = document.getElementById('cp-confirm').value;
    const errEl    = document.getElementById('change-password-error');

    errEl.classList.remove('visible');

    if (!current || !newPwd || !confirm) { errEl.textContent = 'Preencha todos os campos.'; errEl.classList.add('visible'); return; }
    if (newPwd.length < 6) { errEl.textContent = 'A nova senha deve ter pelo menos 6 caracteres.'; errEl.classList.add('visible'); return; }
    if (newPwd !== confirm) { errEl.textContent = 'As senhas não coincidem.'; errEl.classList.add('visible'); return; }
    if (newPwd === current) { errEl.textContent = 'A nova senha deve ser diferente da senha temporária.'; errEl.classList.add('visible'); return; }

    const btn = document.getElementById('btn-change-password');
    btn.disabled = true; btn.textContent = 'Salvando...';

    try {
      const data = await apiCall('users', { action: 'change_password', user_id: pendingUser.id, new_password: newPwd });
      if (data.success) {
        document.getElementById('change-password-screen').hidden = true;
        localStorage.setItem('dt_current_user', JSON.stringify(pendingUser));
        startChat(pendingUser);
        pendingUser = null;
      } else {
        errEl.textContent = data.error || 'Erro ao alterar senha.';
        errEl.classList.add('visible');
      }
    } catch(e) {
      errEl.textContent = 'Erro de conexão. Tente novamente.';
      errEl.classList.add('visible');
    } finally {
      btn.disabled = false; btn.textContent = 'Salvar senha';
    }
  }

  document.getElementById('btn-change-password').addEventListener('click', doChangePassword);
  ['cp-current','cp-new','cp-confirm'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') doChangePassword(); });
  });

  function doLogout() {
    localStorage.removeItem('dt_current_user');
    currentUser = null;
    document.getElementById('chat-screen').hidden = true;
    document.getElementById('login-screen').hidden = false;
    document.getElementById('change-password-screen').hidden = true;
    document.getElementById('btn-history').hidden = true;
    document.getElementById('btn-new-chat').hidden = true;
    document.getElementById('btn-logout').hidden = true;
    document.getElementById('btn-crm').hidden = true;
    document.getElementById('btn-meetings').hidden = true;
    document.getElementById('btn-tools').hidden = true;
    document.getElementById('btn-magf').hidden = true;
    document.getElementById('btn-pb').hidden = true;
    closeCRMMenu();
    document.getElementById('header-user').textContent = '';
    inputEmail.value = '';
    inputPwd.value = '';
    hideLoginError();
    // Limpa mensagens
    const msgs = document.getElementById('messages');
    while (msgs.firstChild && msgs.firstChild !== typingIndicator) msgs.removeChild(msgs.firstChild);
    msgs.insertBefore(welcomeDiv, typingIndicator);
  }

  function startChat(user) {
    currentUser = user;
    document.getElementById('header-user').textContent = user.name;
    document.getElementById('welcome-name').textContent = user.name.split(' ')[0];
    document.getElementById('btn-history').hidden = false;
    document.getElementById('btn-new-chat').hidden = false;
    document.getElementById('btn-logout').hidden = false;
    document.getElementById('btn-crm').hidden = !CRM_ENABLED;
    document.getElementById('btn-meetings').hidden = !MEETINGS_ENABLED;
    document.getElementById('btn-tools').hidden = !TOOLS_ENABLED;
    document.getElementById('btn-magf').hidden = !MAGF_ENABLED;
    // O PB é painel de gestão: só aparece para quem tem acesso geral. Esconder
    // é conveniência de tela — quem é gestor o backend decide sozinho, pela
    // lista MANAGERS do Detect CRM Intent.
    document.getElementById('btn-pb').hidden = !(PB_ENABLED && isCRMManager());
    document.getElementById('login-screen').hidden = true;
    document.getElementById('chat-screen').hidden = false;
    document.getElementById('msg-input').focus();
  }

  // ── CHAT ────────────────────────────────────────────────────────────────────
  const messagesEl     = document.getElementById('messages');
  const typingIndicator = document.getElementById('typing-indicator');
  const welcomeDiv     = messagesEl.querySelector('.welcome-msg');
  const input          = document.getElementById('msg-input');
  const btnSend        = document.getElementById('btn-send');

  function timeStr() {
    return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  function addMessage(role, text, sources, meetings, tools) {
    const isUser = role === 'user';
    const initials = isUser
      ? currentUser.name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase()
      : LOGO;

    const row = document.createElement('div');
    row.className = `msg-row ${isUser ? 'user' : 'bot'}`;

    let sourcesHtml = '';
    if (sources && sources.length > 0) {
      const tags = sources.map(s => `<span class="source-tag">📄 ${s}</span>`).join('');
      sourcesHtml = `<div class="msg-sources">${tags}</div>`;
    }

    row.innerHTML = `
      <div class="msg-avatar">${initials}</div>
      <div>
        <div class="msg-bubble">${isUser ? escapeHtml(text) : renderMarkdown(text)}</div>
        ${sourcesHtml}
        <div class="msg-meta">${timeStr()}</div>
      </div>`;

    // Botões de reunião — via DOM (textContent), nunca interpolando título em onclick.
    if (Array.isArray(meetings) && meetings.length > 0) {
      const wrapper = row.lastElementChild;
      const list = document.createElement('div');
      list.className = 'meetings-list';
      meetings.forEach(m => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'meeting-item';
        const titulo = m.titulo || 'Sem título';
        const dataStr = m.data ? (' — ' + m.data) : '';
        btn.textContent = '📄 ' + titulo + dataStr;
        btn.addEventListener('click', () => sendCRMCommand('__MEETINGS:SUMMARY:' + m.id + '__', 'ATA: ' + titulo));
        list.appendChild(btn);
      });
      wrapper.insertBefore(list, wrapper.querySelector('.msg-meta'));
    }

    // Botões de ferramenta — mesmo padrão dos de reunião (DOM/textContent, sem onclick inline).
    if (Array.isArray(tools) && tools.length > 0) {
      const wrapper = row.lastElementChild;
      const list = document.createElement('div');
      list.className = 'tools-list';
      tools.forEach(t => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tool-item';
        const name = t.name || 'Ferramenta';
        btn.textContent = '🛠️ ' + name;
        btn.addEventListener('click', () => sendCRMCommand('__TOOLS:DETAIL:' + t.id + '__', 'Detalhe: ' + name));
        list.appendChild(btn);
      });
      wrapper.insertBefore(list, wrapper.querySelector('.msg-meta'));
    }

    messagesEl.insertBefore(row, typingIndicator);
    scrollToBottom();
  }

  function setTyping(visible) {
    typingIndicator.classList.toggle('visible', visible);
    scrollToBottom();
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }

  function renderMarkdown(str) {
    const lines = str.split('\n');
    const out = [];
    let i = 0;
    while (i < lines.length) {
      // Detecta bloco de tabela markdown
      if (i + 1 < lines.length && /^\|.*\|/.test(lines[i]) && /^\|[-| :]+\|/.test(lines[i+1])) {
        const headers = lines[i].split('|').slice(1,-1).map(h => h.trim());
        i += 2; // pula header e separador
        const rows = [];
        while (i < lines.length && /^\|.*\|/.test(lines[i])) {
          rows.push(lines[i].split('|').slice(1,-1).map(c => c.trim()));
          i++;
        }
        let tbl = '<table><thead><tr>' + headers.map(h => '<th>' + inlineFormat(h) + '</th>').join('') + '</tr></thead><tbody>';
        rows.forEach(r => { tbl += '<tr>' + r.map(c => '<td>' + inlineFormat(c) + '</td>').join('') + '</tr>'; });
        tbl += '</tbody></table>';
        out.push('<div class="msg-table-wrap">' + tbl + '</div>');
      } else if (/^\s*\*\*(.+?)\*\*\s*$/.test(lines[i])) {
        // Linha inteira em **negrito** vira título de seção com destaque (em vez de negrito solto no meio do texto).
        const title = lines[i].match(/^\s*\*\*(.+?)\*\*\s*$/)[1];
        out.push('<div class="msg-section-title">' + title + '</div>');
        i++;
      } else {
        out.push(lines[i]);
        i++;
      }
    }
    return out.join('\n')
      .replace(/&(?!(?:amp|lt|gt|table|thead|tbody|tr|th|td|\/);)/g, '&amp;')
      .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.*?)\*/g,'<em>$1</em>')
      .replace(/^#{1,3} (.+)$/gm,'<strong>$1</strong>')
      .replace(/^\s*-{3,}\s*$/gm,'<hr>')
      .replace(/^\s*\d+\.\s+(.+)$/gm,'<lio>$1</lio>')
      .replace(/^\s*[-*]\s+(.+)$/gm,'<li>$1</li>')
      .replace(/(<lio>[\s\S]*?<\/lio>(\n<lio>[\s\S]*?<\/lio>)*)/g,'<ol>$1</ol>')
      .replace(/(<li>[\s\S]*?<\/li>(\n<li>[\s\S]*?<\/li>)*)/g,'<ul>$1</ul>')
      .replace(/<\/ol>\n<ol>/g,'')
      .replace(/<\/ul>\n<ul>/g,'')
      .replace(/<lio>/g,'<li>').replace(/<\/lio>/g,'</li>')
      .replace(/\n\n/g,'</p><p>')
      .replace(/\n(?!<)/g,'<br>')
      .replace(/^(?!<)/, '<p>').replace(/(?!>)$/, '</p>');
  }

  function inlineFormat(s) {
    // !!texto!! vira célula em vermelho — usado pelo PB para marcar
    // inconsistência entre Confiança e Prob. fech. (%) numa mesma linha.
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/!!(.*?)!!/g,'<span class="cell-danger">$1</span>')
            .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
            .replace(/\*(.*?)\*/g,'<em>$1</em>');
  }

  async function sendMessage() {
    const userText = input.value.trim();
    if (!userText || !currentUser) return;

    // Monta query — se há arquivo anexado, prefixa o contexto
    let query = userText;
    const hasAttach = attachedText && attachedName;
    if (hasAttach) {
      query = `[Contexto do arquivo: ${attachedName}]\n${attachedText}\n\nPergunta: ${userText}`;
    }

    input.value = '';
    input.style.height = 'auto';
    btnSend.disabled = true;

    // Exibe mensagem do usuário (sem o bloco de contexto completo — só o que ele digitou)
    addMessage('user', hasAttach ? `📄 ${attachedName}\n\n${userText}` : userText);

    // Remove chip do arquivo após enviar
    if (hasAttach) removeAttachment();

    setTyping(true);

    try {
      const sid  = getSessionId(currentUser.id);
      const data = await apiCall('chat', { query, session_id: sid, user_id: currentUser.id, user_email: currentUser.email });
      setTyping(false);
      addMessage('bot', data.answer || '(sem resposta)', data.sources, data.meetings, data.tools);
    } catch(e) {
      setTyping(false);
      showToast('Erro ao enviar mensagem. Tente novamente.');
    } finally {
      btnSend.disabled = false;
      input.focus();
    }
  }

  function readAsText(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.onerror = () => reject(new Error('Falha na leitura'));
      reader.readAsText(file, 'utf-8');
    });
  }

  async function extractPdfText(file) {
    // PDF.js carregado como módulo ES — acessado via import dinâmico
    const pdfjsLib = await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs');
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs';

    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    let text = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(s => s.str).join(' ') + '\n';
    }
    return text;
  }

      }).join('');
      return `<div class="crm-menu-section">${b[0]}</div>${itens}`;
    }).join('<div class="crm-menu-divider"></div>');

    // Filtro ativo em destaque no topo: sem isso alguém escolhe uma pessoa,
    // fecha o menu, reabre depois e não lembra que ainda está filtrado — e lê
    // a carteira de um como se fosse a do time.
    const filtro = pbSeller ? `
      <div class="menu-filtro">
        <span class="menu-filtro-txt">👤 ${pbSeller.name}</span>
        <button class="menu-filtro-x" onclick="pbClearSeller()" title="Ver o time inteiro">ver todos ✕</button>
      </div>
      <div class="crm-menu-divider"></div>` : '';

    menu.innerHTML = `
      <div class="crm-menu-header">
        <span class="crm-menu-title">PB — Painel estratégico</span>
        <button class="crm-menu-close" onclick="closeCRMMenu()">✕</button>
      </div>
      <div class="crm-menu-body">
        ${filtro}
        ${blocos}
        <div class="crm-menu-divider"></div>
        <button class="crm-menu-item" onclick="pbMenuState='sellers';renderPBMenu()">
          <span class="crm-menu-icon">👥</span>
          <span class="crm-menu-label">${pbSeller ? 'Trocar de colaborador' : 'Ver por colaborador'}</span>
          <span class="crm-menu-arrow">›</span>
        </button>
      </div>`;
  }

  function openMAGFMenu() {
    magfMenuState = 'main';
    document.getElementById('crm-menu-overlay').classList.add('open');
    document.getElementById('crm-menu').classList.add('open');
    renderMAGFMenu();
  }

  // Vendedor escolhido FICA escolhido (Anderson, 19/08): antes, clicar num nome
  // disparava direto o PIPELINE daquela pessoa e acabava ali — para ver os
  // fechamentos dela era preciso voltar, escolher de novo, e não havia como.
  // Agora a escolha fixa o recorte e TODAS as opções do menu passam a valer
  // para ela, até trocar ou limpar.
  let magfSeller = null;

  // As ações MY_* forçam o escopo do usuário logado no backend incondicional-
  // mente — nem "Todos" nem um vendedor escolhido mudam isso, porque no
  // Build SQL do MAGF `forcaProprio` ignora `escolhido`. Isso é exatamente o
  // oposto do que se quer nestes 4 botões (Anderson, 20/08): com "Todos" ou
  // um vendedor selecionado, o clique tem que seguir a seleção, não travar
  // no próprio usuário. Por isso magfCmd SEMPRE troca a ação MY_* pela irmã
  // que aceita alvo (MAGF_EQUIV) — a ação genérica já faz o certo sozinha:
  // gestor sem seleção vê o time, com seleção vê a pessoa, vendedor comum
  // (sem seletor) sempre vê só o próprio.
  const MAGF_EQUIV = {
    MY_OPEN: 'OPEN_LIST',
    MY_PIPELINE: 'PIPELINE',
    MY_CLOSING: 'CLOSING_90D',
    MY_CLOSING_MONTH: 'CLOSING_MONTH'
  };

  function magfCmd(acao, rotulo) {
    const alvo = MAGF_EQUIV[acao] || acao;
    const rot = magfSeller ? (rotulo + ' — ' + magfSeller) : rotulo;
    const extras = magfSeller ? { magf_seller_email: magfSeller } : {};
    sendCRMCommand('__MAGF:' + alvo + '__', rot, extras);
  }

  // Selecionar o vendedor já entrega o painel completo dele — decisão de
  // 18/08, aplicada em 20/08. Antes disso o clique só marcava o filtro e
  // devolvia ao menu, esperando o gestor escolher uma das ações avulsas
  // (o que existia era "pipeline por etapa", 3 linhas). `magfCmd` fecha o
  // menu sozinho (via sendCRMCommand) e o filtro continua ativo depois —
  // as ações avulsas do menu (Fechando em 7 dias, Vencidos, etc.) seguem
  // disponíveis pra quem quiser um recorte mais específico do mesmo vendedor.
  function magfSelectSeller(e) {
    magfSeller = e;
    magfMenuState = 'main';
    magfCmd('VENDOR_PANEL', 'Painel completo');
  }

  function magfClearSeller() {
    magfSeller = null;
    renderMAGFMenu();
  }

  function renderMAGFMenu() {
    const menu = document.getElementById('crm-menu');

      // "Todos" na mesma lista (Anderson, 20/08) — mesma ideia do RD.
      const itemTodos = `
        <button class="crm-menu-item" onclick="magfClearSeller();magfMenuState='main';renderMAGFMenu()">
          <span class="crm-menu-icon">${magfSeller ? '👥' : '✓'}</span>
          <span class="crm-menu-label"><strong>Todos</strong></span>
        </button>
        <div class="crm-menu-divider"></div>`;
      const itens = itemTodos + MAGF_SELLERS.map(function (e) {
        const sel = (e === magfSeller) ? ' style="font-weight:700"' : '';
        return `
          <button class="crm-menu-item" onclick="magfSelectSeller('${e}')"${sel}>

            <span class="crm-menu-label">${e}</span>

      menu.innerHTML = `
        <div class="crm-menu-header">

        </div>
        <div class="crm-menu-body">
          <button class="crm-menu-item" onclick="magfMenuState='main';renderMAGFMenu()">

          <div class="crm-menu-divider"></div>

        </div>`;

    }

    // Filtro ativo em destaque: sem isto alguém escolhe uma pessoa, fecha o
    // menu, reabre depois e lê a carteira de um como se fosse a do time.
    const filtroMagf = magfSeller ? `
      <div class="menu-filtro">
        <span class="menu-filtro-txt">👤 ${magfSeller}</span>
        <button class="menu-filtro-x" onclick="magfClearSeller()" title="Ver o time inteiro">ver todos ✕</button>

    // Vendedor comum não acessa o seletor de vendedor (linhaGestor abaixo),
    // então precisa de uma porta direta pro próprio painel completo — pro
    // gestor essa mesma tela já é alcançável selecionando o próprio nome na
    // lista de "Ver pipeline de um vendedor".
    const botaoPainelProprio = !isMAGFManager() ? `
      <button class="crm-menu-item" onclick="magfCmd('VENDOR_PANEL','Meu painel completo')">
        <span class="crm-menu-icon">📊</span>
        <span class="crm-menu-label">Meu painel completo</span>
      </button>
      <div class="crm-menu-divider"></div>` : '';

    const linhaGestor = isMAGFManager() ? `
      <div class="crm-menu-divider"></div>
      <button class="crm-menu-item" onclick="magfMenuState='sellers';renderMAGFMenu()">
        <span class="crm-menu-icon">👥</span>
        <span class="crm-menu-label">${magfSeller ? 'Trocar de vendedor' : 'Ver pipeline de um vendedor'}</span>
        <span class="crm-menu-arrow">›</span>
      </button>
      <button class="crm-menu-item" onclick="magfCmd('BY_SELLER','Magenta Force — pipeline por vendedor')">
        <span class="crm-menu-icon">🏆</span>
        <span class="crm-menu-label">Ranking por vendedor</span>
      </button>
      <button class="crm-menu-item" onclick="magfCmd('WIN_BY_SELLER','Win rate por vendedor')">
        <span class="crm-menu-icon">🎯</span>
        <span class="crm-menu-label">Win rate por vendedor</span>
      </button>` : '';

    menu.innerHTML = `
      <div class="crm-menu-header">
        <span class="crm-menu-title">🎯 Magenta Force — o que deseja ver?</span>
        <button class="crm-menu-close" onclick="closeCRMMenu()">✕</button>
      </div>
      <div class="crm-menu-body">
        ${filtroMagf}
        ${botaoPainelProprio}
        <button class="crm-menu-item" onclick="magfCmd('MY_OPEN','Pipeline aberto')">
          <span class="crm-menu-icon">📋</span>
          <span class="crm-menu-label">Pipeline aberto</span>
        </button>
        <button class="crm-menu-item" onclick="magfCmd('MY_PIPELINE','Pipeline por etapa')">
          <span class="crm-menu-icon">📊</span>
          <span class="crm-menu-label">Pipeline por etapa</span>
        </button>
        <button class="crm-menu-item" onclick="magfCmd('MY_CLOSING_MONTH','Fechando neste mês')">
          <span class="crm-menu-icon">🗓️</span>
          <span class="crm-menu-label">Fechando neste mês</span>
        </button>
        <button class="crm-menu-item" onclick="magfCmd('CLOSING_7D','Fechamentos — próximos 7 dias')">
          <span class="crm-menu-icon">🔔</span>
          <span class="crm-menu-label">Fechando em 7 dias</span>
        </button>
        <button class="crm-menu-item" onclick="magfCmd('CLOSING_30D','Fechamentos — próximos 30 dias')">
          <span class="crm-menu-icon">📆</span>
          <span class="crm-menu-label">Fechando em 30 dias</span>
        </button>
        <button class="crm-menu-item" onclick="magfCmd('MY_CLOSING','Fechamentos — 90 dias')">
          <span class="crm-menu-icon">📅</span>

        </button>
        <div class="crm-menu-divider"></div>
        <button class="crm-menu-item" onclick="magfCmd('CREATED_7D','Oportunidades criadas — últimos 7 dias')">
          <span class="crm-menu-icon">🆕</span>
          <span class="crm-menu-label">Criadas — últimos 7 dias</span>
        </button>
        <button class="crm-menu-item" onclick="magfCmd('CREATED_15D','Oportunidades criadas — últimos 15 dias')">
          <span class="crm-menu-icon">🆕</span>
          <span class="crm-menu-label">Criadas — últimos 15 dias</span>
        </button>
        <button class="crm-menu-item" onclick="magfCmd('CREATED_30D','Oportunidades criadas — últimos 30 dias')">
          <span class="crm-menu-icon">🆕</span>
          <span class="crm-menu-label">Criadas — último mês</span>
        </button>
        <div class="crm-menu-divider"></div>
        <button class="crm-menu-item" onclick="magfCmd('TOP_DEALS','Maiores oportunidades abertas')">
          <span class="crm-menu-icon">💰</span>
          <span class="crm-menu-label">Maiores oportunidades</span>
        </button>
        <div class="crm-menu-divider"></div>
        <button class="crm-menu-item" onclick="magfCmd('BY_CUSTOMER','Pipeline por cliente')">
          <span class="crm-menu-icon">🏢</span>
          <span class="crm-menu-label">Por cliente</span>
        </button>
        <button class="crm-menu-item" onclick="magfCmd('BY_BUSINESS_TYPE','Pipeline por tipo de negócio')">
          <span class="crm-menu-icon">🔄</span>

        <div class="crm-menu-divider"></div>
        <button class="crm-menu-item" onclick="magfCmd('FORECAST','Forecast ponderado')">

        <button class="crm-menu-item" onclick="magfCmd('OVERDUE','Fechamento vencido')">

        <button class="crm-menu-item" onclick="magfCmd('STALLED','Sem movimento há mais de 30 dias')">

  function renderCRMMenu() {
    const menu = document.getElementById('crm-menu');

    if (crmMenuState === 'main') {
      const managerRow = isCRMManager() ? `
        <div class="crm-menu-divider"></div>
        <button class="crm-menu-item" onclick="crmMenuState='sellers';renderCRMMenu()">
          <span class="crm-menu-icon">👥</span>
          <span class="crm-menu-label">${crmSelectedSeller ? 'Trocar de vendedor' : 'Ver leads da equipe'}</span>
          <span class="crm-menu-arrow">›</span>
        </button>` : '';

      // Filtro ativo: a seleção sobrevive ao fechar do menu, então precisa
      // estar visível — senão lê-se a carteira de um como se fosse a do time.
      // O aviso sobre tarefas está aqui porque elas continuam sendo as SUAS
      // mesmo com alguém selecionado, e isso surpreenderia sem explicação.
      const filtroCrm = crmSelectedSeller ? `
        <div class="menu-filtro">
          <span class="menu-filtro-txt">👤 ${crmSelectedSeller.name}</span>
          <button class="menu-filtro-x" onclick="crmClearSeller()" title="Voltar para os meus">ver os meus ✕</button>
        </div>
        <div class="crm-menu-divider"></div>` : '';

      menu.innerHTML = `
        <div class="crm-menu-header">
          <span class="crm-menu-title">📊 CRM — O que deseja fazer?</span>
          <button class="crm-menu-close" onclick="closeCRMMenu()">✕</button>
        </div>
        <div class="crm-menu-items">
          ${filtroCrm}
          <button class="crm-menu-item" onclick="crmCmd('LEADS_7D','Minhas atualizações — últimos 7 dias')">
            <span class="crm-menu-icon">📋</span>
            <span class="crm-menu-label">Minhas atualizações — últimos 7 dias</span>
          </button>
          <button class="crm-menu-item" onclick="crmCmd('LEADS_15D','Minhas atualizações — últimos 15 dias')">
            <span class="crm-menu-icon">📋</span>
            <span class="crm-menu-label">Minhas atualizações — últimos 15 dias</span>
          </button>
          <button class="crm-menu-item" onclick="crmCmd('LEADS_30D','Minhas atualizações — último mês')">
            <span class="crm-menu-icon">📋</span>
            <span class="crm-menu-label">Minhas atualizações — último mês</span>
          </button>
          <div class="crm-menu-divider"></div>
          <button class="crm-menu-item" onclick="crmCmd('LEADS_CREATED_7D','Meus leads criados — últimos 7 dias')">
            <span class="crm-menu-icon">🆕</span>
            <span class="crm-menu-label">Meus leads criados — últimos 7 dias</span>
          </button>
          <button class="crm-menu-item" onclick="crmCmd('LEADS_CREATED_15D','Meus leads criados — últimos 15 dias')">
            <span class="crm-menu-icon">🆕</span>
            <span class="crm-menu-label">Meus leads criados — últimos 15 dias</span>
          </button>
          <button class="crm-menu-item" onclick="crmCmd('LEADS_CREATED_30D','Meus leads criados — último mês')">
            <span class="crm-menu-icon">🆕</span>
            <span class="crm-menu-label">Meus leads criados — último mês</span>
          </button>
          <div class="crm-menu-divider"></div>
          <button class="crm-menu-item" onclick="crmCmd('GROWTH_WW','Crescimento semana a semana')">
            <span class="crm-menu-icon">📈</span>
            <span class="crm-menu-label">Crescimento semana a semana</span>
          </button>
          <button class="crm-menu-item" onclick="crmCmd('FUNNEL','Ver meu funil completo')">
            <span class="crm-menu-icon">🔽</span>
            <span class="crm-menu-label">Ver meu funil completo</span>
          </button>
          <button class="crm-menu-item" onclick="crmCmd('ALERT_NO_OPP','Pre Sales sem Nº Oportunidade')">
            <span class="crm-menu-icon">⚠️</span>
            <span class="crm-menu-label">Pre Sales sem Nº Oportunidade</span>
          </button>
          <div class="crm-menu-divider"></div>
          <button class="crm-menu-item" onclick="crmCmd('TASKS_TODAY','Minhas tarefas de hoje')">
            <span class="crm-menu-icon">✅</span>
            <span class="crm-menu-label">Minhas tarefas — hoje</span>
          </button>
          <button class="crm-menu-item" onclick="crmCmd('TASKS_WEEK','Minhas tarefas desta semana')">
            <span class="crm-menu-icon">🗓️</span>
            <span class="crm-menu-label">Minhas tarefas — esta semana</span>
          </button>
          <div class="crm-menu-divider"></div>
          <button class="crm-menu-item" onclick="crmCmd('CREATE_LEAD','Criar novo lead')">
            <span class="crm-menu-icon">➕</span>
            <span class="crm-menu-label">Criar novo lead</span>
          </button>
          ${managerRow}
        </div>`;

    } else if (crmMenuState === 'sellers') {
      // "Todos" na mesma lista, sem sair dela para limpar a seleção (Anderson,
      // 20/08) — antes só dava para limpar pelo chip no topo do menu principal.
      const itemTodos = `
        <button class="crm-menu-item" onclick="crmClearSeller();crmMenuState='main';renderCRMMenu()">
          <span class="crm-menu-icon">${crmSelectedSeller ? '👥' : '✓'}</span>
          <span class="crm-menu-label"><strong>Todos</strong></span>
        </button>
        <div class="crm-menu-divider"></div>`;
      const items = CRM_SELLERS.map((s, i) => `
        <button class="crm-menu-item" onclick="crmSelectSeller(${i})">
          <span class="crm-menu-icon">${crmSelectedSeller && crmSelectedSeller.id === s.id ? '✓' : '👤'}</span>
          <span class="crm-menu-label">${s.name}</span>
          <span class="crm-menu-arrow">›</span>
        </button>`).join('');

      menu.innerHTML = `
        <div class="crm-menu-header">
          <button class="crm-menu-back visible" onclick="crmMenuState='main';renderCRMMenu()">‹</button>
          <span class="crm-menu-title">Selecione o vendedor</span>
          <button class="crm-menu-close" onclick="closeCRMMenu()">✕</button>
        </div>
        <div class="crm-menu-items">${itemTodos}${items}</div>`;

    }
  }

  async function sendCRMCommand(cmd, label, extras) {
    closeCRMMenu();
    addMessage('user', label);
    setTyping(true);
    try {
      const sid  = getSessionId(currentUser.id);
      const data = await apiCall('chat', {
        query: cmd, session_id: sid,
        user_id: currentUser.id, user_email: currentUser.email,
        ...(extras || {})
      });
      setTyping(false);
      addMessage('bot', data.answer || '(sem resposta)', data.sources, data.meetings, data.tools);
    } catch(e) {
      setTyping(false);
      showToast('Erro ao consultar CRM. Tente novamente.');
    }
  }

  document.getElementById('btn-crm').addEventListener('click', openCRMMenu);
  document.getElementById('crm-menu-overlay').addEventListener('click', closeCRMMenu);
  document.getElementById('btn-meetings').addEventListener('click', () => {
    sendCRMCommand('__MEETINGS:LIST__', '📅 Ver reuniões disponíveis');
  });
  document.getElementById('btn-tools').addEventListener('click', () => {
    sendCRMCommand('__TOOLS:LIST__', '🛠️ Ver ferramentas de IA aprovadas');
  });
  document.getElementById('btn-magf').addEventListener('click', openMAGFMenu);
  document.getElementById('btn-pb').addEventListener('click', openPBMenu);

  // ── INIT — verifica sessão salva ─────────────────────────────────────────────
  (async () => {
    const saved = localStorage.getItem('dt_current_user');
    if (!saved) return;
    let u;
    try { u = JSON.parse(saved); }
    catch(e) { localStorage.removeItem('dt_current_user'); return; }
    if (!u.email) { localStorage.removeItem('dt_current_user'); return; } // sessão antiga sem email → força relogin

    // Revalida com o backend antes de pular a tela de login: o cache local pode
    // estar defasado (ex.: admin resetou a senha depois desse login ficar salvo).
    try {
      const status = await apiCall('users', { action: 'check_session', user_id: u.id });
      if (status.success === false || status.active === false) {
        localStorage.removeItem('dt_current_user');
        return;
      }
      if (status.must_change_password) { showChangePassword(u); return; }
      u.must_change_password = false;
      localStorage.setItem('dt_current_user', JSON.stringify(u));
      startChat(u);
    } catch(e) {
      // Falha de rede: não bloqueia o usuário, segue com o cache local.
      startChat(u);
    }
  })();
</script>
